#!name=Spotify Premium（圈X 修订版）
#!homepage=https://github.com/devchristian1337/loon-plugins
#!author=devchristian1337（Loon 原版）／圈X 移植修订
#!date=2026-11-21
#!desc=基于 loon-plugins 官方 Spotify.lpx（2026-11-10 版，已适配 Spotify iOS 9.1.98）移植到 Quantumult X；补齐了原移植稿缺失的 4 处规则，并修掉 eevee／ev3 抢跑冲突。

# ============================================================
# 一、重写规则
# 用法：圈X → 设置 → 重写 → 规则资源 → 右上角「+」新建资源，
#       把本文件（去掉下面的「二、三」两节）整段粘贴进去；
#       或直接写入配置文件的 [rewrite_local] 区块。
# 注意：以 # 开头的行是注释，圈X 会忽略，# 开头的 #! 头信息同理。
# ============================================================

# 1) 广告下发接口：掐断后播放器会跳过广告时段
^https:\/\/(?:spclient\.wg|[\w-]+-spclient)\.spotify\.com(?::443)?\/(?:ads\/|ad-logic\/|[^?#]*\/ad-on-app-open|premium-marketing\/upsellOffer) url reject
^https:\/\/(spclient\.wg|.*-spclient)\.spotify\.com(:443)?\/pendragon url reject-dict

# 2) gabo 埋点上报：请求头阶段直接伪造空 200
^https:\/\/(.*-spclient\.spotify\.com(:443)?|spclient\.wg\.spotify\.com)\/gabo-receiver-service url script-request-header https://raw.githubusercontent.com/devchristian1337/loon-plugins/refs/heads/main/Scripts/Spotify/spot-gabo.js

# 3) 界面内广告位（protobuf 响应改写）：搜索页 / 首页 / 滑动流
^https:\/\/(spclient\.wg\.spotify\.com|.*-spclient\.spotify\.com(:443)?)\/browsita\/v.\/browse url script-response-body https://raw.githubusercontent.com/devchristian1337/loon-plugins/refs/heads/main/Scripts/Spotify/spot-NoSearchAd.js
^https:\/\/(spclient\.wg\.spotify\.com|.*-spclient\.spotify\.com(:443)?)\/casita\/v.\/home\/ url script-response-body https://raw.githubusercontent.com/devchristian1337/loon-plugins/refs/heads/main/Scripts/Spotify/spot-NoHomeAd.js
^https:\/\/(spclient\.wg\.spotify\.com|.*-spclient\.spotify\.com(:443)?)\/scrollsita\/v.\/scroll\/spotify url script-response-body https://raw.githubusercontent.com/devchristian1337/loon-plugins/refs/heads/main/Scripts/Spotify/spot-NoScrollAd.js

# 4) Premium 属性注入（bootstrap / customize）
#    ⚠ 同一响应只会执行「第一条命中」的脚本。原移植稿在这里同时挂了
#      spot-proto-eevee.js 和 spot-proto-ev3.js，结果永远只跑 eevee，
#      作者推荐的 ev3（本地 Premium 配置快照覆盖）从未执行 —— 已删除 eevee 行。
#    若删掉 eevee 后反而有部分 Premium 属性不生效，可反过来只留 eevee 试一次。
^https:\/\/(spclient\.wg\.spotify\.com|.*-spclient\.spotify\.com(:443)?)\/(bootstrap\/v1\/bootstrap|user-customization-service\/v1\/customize)(\?.*)?$ url script-response-body https://raw.githubusercontent.com/devchristian1337/loon-plugins/refs/heads/main/Scripts/Spotify/spot-proto-ev3.js

# 5) App 9.1.98+ 新增的「配置 / 账号属性」刷新接口（原稿已有，保留）
^https:\/\/(?:spclient\.wg|[\w-]+-spclient)\.spotify\.com(?::443)?\/(?:remote-config-resolver\/v\d+\/configuration|nebula\/v\d+\/configuration\/attributes)(?:\?[^#]*)?$ url script-response-body https://raw.githubusercontent.com/devchristian1337/loon-plugins/refs/heads/main/Scripts/Spotify/spot-proto-ev3.js

# 6)【本次新增·关键】删除条件请求头 if-none-match / if-modified-since。
#    9.1.98 起配置与属性走上面两个新接口，若带着 if-none-match，服务端直接回 304，
#    App 继续用未改写的本地缓存 → 表现为「规则装了完全没效果」。
#    圈X 没有 Loon 的 header-del 动作，等价做法是挂一个 script-request-header 小脚本。
#    需先把 spot-del-inm.js 放到「我的 iPhone / Quantumult X / Scripts /」目录下。
^https:\/\/(spclient\.wg\.spotify\.com|.*-spclient\.spotify\.com(:443)?)\/(bootstrap\/v1\/bootstrap|user-customization-service\/v1\/customize)(\?.*)?$ url script-request-header Scripts/spot-del-inm.js
^https:\/\/(?:spclient\.wg|[\w-]+-spclient)\.spotify\.com(?::443)?\/(?:remote-config-resolver\/v\d+\/configuration|nebula\/v\d+\/configuration\/attributes)(?:\?[^#]*)?$ url script-request-header Scripts/spot-del-inm.js

# 7)【本次新增·可选】对应 Loon 插件里的三个开关；圈X 没有开关语法，要哪个留哪个。
# 7.1 隐藏「正在播放」页的发现流
^https:\/\/(?:spclient\.wg|[\w-]+-spclient)\.spotify\.com(?::443)?\/watch-feed-entrypoints\/v\d\/discovery-from-seed url reject-dict
# 7.2 隐藏设置页的会员信息（仅显示层，不改服务端状态）
^https:\/\/[\w-]+-spclient\.spotify\.com(?::443)?\/pam-view-service\/ url reject-dict
# 7.3 屏蔽 AI DJ 入口
^https:\/\/(?:spclient\.wg|[\w-]+-spclient)\.spotify\.com(?::443)?\/.*37i9dQZF1EYkqdzj48dyYq url reject-dict


# ============================================================
# 二、分流规则（写进 [filter_local]，不要放进重写资源）
# ============================================================
# 阻断 Spotify 的 QUIC/HTTP3：否则广告流量可绕开 MITM 直连，规则形同虚设
AND,((DOMAIN-SUFFIX,spotify.com),(PROTOCOL,QUIC)),REJECT
# 广告事件上报域名
host, aet.spotify.com, REJECT
# 注：若你的圈X 版本提示 AND/PROTOCOL 这条解析失败，删掉它即可，其余规则不受影响。


# ============================================================
# 三、MITM 主机名（必须手动填到：设置 → MitM → 主机名）
# ============================================================
# spclient.wg.spotify.com, *spclient.spotify.com
# 注意是 *spclient（不是原稿的 *-spclient），后者会漏掉部分区域节点域名。
# 重写资源文件里的 hostname = 这一行圈X 并不解析，写在里面是无效行。
